name: release-integrity

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release-validation dependencies
        run: python -m pip install numpy scikit-learn pyyaml
      - name: Verify the public subpackage manifest
        run: |
          cd reproducibility/20261017
          sha256sum -c SHA256SUMS.txt --quiet
      - name: Validate public tree hygiene
        run: python scripts/validate_public_tree.py
      - name: Run independent secret scan
        run: bash scripts/scan_secrets.sh
      - name: Validate release metadata
        run: python scripts/validate_metadata.py
      - name: Validate result registry
        run: python scripts/validate_registry.py
      - name: Install evidence-validator dependencies
        run: python -m pip install numpy scikit-learn
      - name: Recompute registry values from their backing predictions
        run: python scripts/validate_oof.py
      - name: Rebuild the registry from the artifacts (round-trip)
        run: python scripts/build_registry.py --check
      - name: Test R3 missing-input and inference guards
        run: python -m unittest discover -s tests
      - name: Recompute R3 effects from compact saved test predictions
        run: python scripts/validate_r3_results.py
      - name: Verify frozen manifest
        run: sha256sum -c MANIFEST.sha256

  synthetic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke dependencies
        run: python -m pip install -r environment/requirements-ci.txt
      - name: Run synthetic end-to-end smoke test
        run: bash run_smoke.sh

  figure-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install figure dependencies
        run: python -m pip install -r figure_sources/requirements_fig6_fig7.txt
      - name: Render revised Figures 6 and 7 from frozen inputs
        run: python figure_sources/make_r3_figures.py --output-dir "$RUNNER_TEMP/r3-figures"
